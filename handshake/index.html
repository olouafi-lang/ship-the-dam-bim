<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handshake Delivery Preflight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <h1>Handshake</h1>
    <p>Check every model export against the person who has to open it, before they do.</p>
  </div>
  <div class="actions">
    <label class="btn primary" for="file-input">Add IFC files</label>
    <input id="file-input" type="file" accept=".ifc" multiple class="visually-hidden">
    <button class="btn" id="demo-btn" type="button">Load demo exports</button>
    <button class="btn quiet" id="reset-btn" type="button">Reset everything</button>
  </div>
</header>

<p class="privacy" id="privacy">Files are read inside this browser tab. Nothing is uploaded, and no AI model sees your project.</p>
<div id="banner" class="banner" hidden></div>

<nav class="tabs" aria-label="Views">
  <a href="#deliveries" data-view="deliveries">Deliveries</a>
  <a href="#drift" data-view="drift">Export drift</a>
  <a href="#recipients" data-view="recipients">Recipients</a>
  <a href="#log" data-view="log">Delivery log</a>
</nav>

<main id="view" class="view"></main>

<div id="drop-veil" class="drop-veil" hidden><span>Drop IFC files to check them</span></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="schema-data.js"></script>
<script src="samples.js"></script>
<script src="ifc-lite.js"></script>
<script src="checks.js"></script>
<script src="app.js"></script>
</body>
</html>
